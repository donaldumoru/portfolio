<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Application developer with a background in human-centered design"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f7f7f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f0d0e"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Donald Umoru" />
    <meta property="og:title" content="Donald Umoru" />
    <meta
      property="og:description"
      content="Application developer with a background in human-centered design"
    />
    <meta property="og:url" content="https://donaldumoru.com/" />
    <link rel="canonical" href="https://donaldumoru.com/" />

    <title>Donald Umoru</title>

    <script>
      (function () {
        const html = document.documentElement;
        const theme = localStorage.getItem('theme');
        if (!theme) {
          return;
        }

        html.classList.remove('light', 'dark');
        html.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
